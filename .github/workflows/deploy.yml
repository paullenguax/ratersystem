name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ratersystem
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY:            ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN:        ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID:         ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET:     ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID:             ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_BENCHMARK_API_KEY:            ${{ secrets.VITE_BENCHMARK_API_KEY }}
          VITE_BENCHMARK_AUTH_DOMAIN:        ${{ secrets.VITE_BENCHMARK_AUTH_DOMAIN }}
          VITE_BENCHMARK_PROJECT_ID:         ${{ secrets.VITE_BENCHMARK_PROJECT_ID }}
          VITE_BENCHMARK_STORAGE_BUCKET:     ${{ secrets.VITE_BENCHMARK_STORAGE_BUCKET }}
          VITE_BENCHMARK_MESSAGING_SENDER_ID: ${{ secrets.VITE_BENCHMARK_MESSAGING_SENDER_ID }}
          VITE_BENCHMARK_APP_ID:             ${{ secrets.VITE_BENCHMARK_APP_ID }}

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        env:
          # FTP-Deploy-Action was built against Node 20; GitHub now defaults
          # JS actions to Node 24, whose different DNS resolution order makes
          # this action's bundled FTP client try IPv6 first and hang before
          # falling back to IPv4 — surfaces as "Timeout (control socket)".
          # This pins the action back to the Node version it actually works on.
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: dist/
          server-dir: lenguax.com/public_html/ratersystem/
          # Give SiteGround more grace before declaring a control-socket
          # timeout — repeated "Timeout (control socket)" failures even
          # without the Node-24 issue point to it being slow to respond
          # under load rather than genuinely unreachable.
          timeout: 120000
          log-level: verbose
          dangerous-clean-slate: false
