<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Storyline Player — Examiner</title>
  <link rel="stylesheet" href="./player.css" />
</head>
<body>
  <div id="internet-status"></div>
  <div class="examiner-shell">
    <header class="exam-header">
      <img src="./assets/lenguax-logo.png" alt="Lenguax" class="exam-logo" />
      <div class="exam-progress">
        <div class="exam-progress-label" id="progress-label">Slide 1/1</div>
        <div class="exam-progress-bar"><div class="exam-progress-fill" id="progress-fill"></div></div>
      </div>
      <div class="exam-timers">
        <span class="exam-timer" id="global-timer" hidden>00:00</span>
        <span class="exam-timer exam-timer-part" id="part-timer" hidden>Part 00:00</span>
        <span class="exam-timer exam-timer-slide" id="slide-timer" hidden>00:00</span>
        <button class="exam-timer-btn" id="slide-timer-btn" type="button" hidden>▶ Start</button>
      </div>
      <label class="volume-control">
        <span>🔊</span>
        <input type="range" id="volume-slider" min="0" max="100" value="100" />
      </label>
      <button id="candidate-status" class="candidate-status" type="button" title="Candidate window closed — click to open">🖥</button>
      <button id="notes-toggle" class="notes-toggle" type="button">Notes</button>
    </header>

    <div class="media-preload" id="media-preload" hidden></div>

    <div class="exam-body">
      <div class="exam-main">
        <main class="slide-card" id="slide-card"></main>
        <nav class="slide-nav">
          <button id="prev-btn" type="button">◀ Back</button>
          <button id="open-candidate" type="button">Open candidate window</button>
          <button id="next-btn" type="button">Next ▶</button>
        </nav>
      </div>

      <aside class="notes-panel" id="notes-drawer">
        <div class="notes-panel-header">
          <h2>Notes</h2>
          <button id="notes-close" type="button">Hide Notes</button>
        </div>
        <div id="notes-content"></div>
      </aside>
    </div>

    <details class="log-panel">
      <summary>Event Log</summary>
      <ul id="event-log"></ul>
    </details>
  </div>

  <script type="module" src="./examiner.ts"></script>
</body>
</html>
